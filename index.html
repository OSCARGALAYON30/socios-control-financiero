function xirr(flows){if(flows.length<2)return null; const t0=new Date(flows[0].date); const npv=r=>flows.reduce((s,f)=>s+f.value/Math.pow(1+r,(new Date(f.date)-t0)/(365*86400000)),0); let lo=-.9999,hi=10; let flo=npv(lo),fhi=npv(hi); for(let k=0;k<20&&flo*fhi>0;k++){hi*=2;fhi=npv(hi)} if(flo*fhi>0)return null; for(let i=0;i<120;i++){const mid=(lo+hi)/2,fm=npv(mid);if(Math.abs(fm)<.01)return mid;if(flo*fm<=0){hi=mid;fhi=fm}else{lo=mid;flo=fm}}return (lo+hi)/2}

function aggregateSentRows(status){

  .filter(r=>!state.sentQuery||r.case.toLowerCase().includes(state.sentQuery.toLowerCase()));
 const m=new Map();
 raw.forEach(r=>{
  const k=r.group_key+'|'+r.investor_norm;
  if(!m.has(k))m.set(k,{...r,investment:0,current_or_return:0,tirVals:[],participation_pct:r.participation_pct});
  const x=m.get(k);
  x.investment+=r.investment;
  x.current_or_return+=r.current_or_return;
  x.tirVals.push(r.tir);
  x.case=x.case.length<=r.case.length?x.case:r.case
 });
 return [...m.values()].map(x=>{
  const flows=[{date:x.invest_date,value:-x.investment},{date:x.valuation_date,value:x.current_or_return}].filter(f=>f.date&&f.value);
  x.tirCalc=xirr(flows)??(x.tirVals.reduce((a,b)=>a+b,0)/Math.max(1,x.tirVals.length));
  return x
 })
}

 const valuationDates=rawRows.map(r=>utcDateMs(r.valuation_date)).filter(x=>x!=null);
 const currentMs=valuationDates.length?Math.max(...valuationDates):utcDateMs(state.cutoff);
 if(!dated.length||!currentMs)return '<section class="panel sent-timeline"><div class="panelhead"><div><h3>Proyección de ingreso vs. valoración actual</h3><p>No hay fechas de expectativa de pago disponibles para la selección actual.</p></div></div></section>';
 const buckets=new Map();
 let overdue=0;
 dated.forEach(({r,date})=>{
   const originalMs=utcDateMs(date); if(originalMs==null)return;
   const effectiveMs=Math.max(originalMs,currentMs);
   if(originalMs<currentMs)overdue++;
   const key=monthKeyFromMs(effectiveMs);
   if(!buckets.has(key))buckets.set(key,{ms:effectiveMs,income:0,cases:[]});
   const b=buckets.get(key); b.income+=Number(r.valoracion_pago||0); b.cases.push({case:r.case,investor:investorLabel(r.investor_norm),value:Number(r.valoracion_pago||0),originalDate:date});
 });
 const ordered=[...buckets.values()].sort((a,b)=>a.ms-b.ms);
 let cumulative=0;
 const points=[{ms:currentMs,income:0,cumulative:0,cases:[],label:monthLabelFromMs(currentMs),isStart:true}];
 ordered.forEach(b=>{cumulative+=b.income;points.push({...b,cumulative,label:monthLabelFromMs(b.ms)})});
 const projectedTotal=cumulative;
 const maxMs=Math.max(points[points.length-1].ms,currentMs+30*86400000);
 const minMs=currentMs, maxY=Math.max(valuationTotal,projectedTotal,1)*1.08;
 const W=1060,H=350,L=74,R=28,T=28,B=48;
 const x=ms=>L+((ms-minMs)/(maxMs-minMs||1))*(W-L-R);
 const y=v=>T+(1-v/maxY)*(H-T-B);
 const projPts=points.map(p=>x(p.ms).toFixed(1)+','+y(p.cumulative).toFixed(1)).join(' ');
 const yTicks=[0,.25,.5,.75,1].map(q=>({v:maxY*q,y:y(maxY*q)}));
 const tickCount=6;
 const xTicks=Array.from({length:tickCount},(_,i)=>minMs+(maxMs-minMs)*(i/(tickCount-1)));
 sentTimelinePoints=points.map((p,i)=>({...p,valuation:valuationTotal,gap:p.cumulative-valuationTotal,index:i}));
 const casesTotal=new Set(rawRows.map(r=>r.group_key)).size;
 return `<section class="panel sent-timeline">
  <div class="panelhead"><div><h3>Proyección de ingreso vs. valoración actual</h3><p>Línea de tiempo del portafolio vigente filtrado · ingreso proyectado acumulado</p></div><span class="pill green">${casesTotal} casos</span></div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Proyección de ingreso acumulado versus valoración actual de sentencias">
   ${yTicks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${t.y}" y2="${t.y}" stroke="#e5e7eb" stroke-width="1"/><text x="${L-10}" y="${t.y+4}" text-anchor="end" font-size="10" fill="#667085">${compact(t.v)}</text>`).join('')}
   ${xTicks.map(ms=>`<line x1="${x(ms)}" x2="${x(ms)}" y1="${T}" y2="${H-B}" stroke="#f1f3f5" stroke-width="1"/><text x="${x(ms)}" y="${H-18}" text-anchor="middle" font-size="10" fill="#667085">${monthLabelFromMs(ms)}</text>`).join('')}
   <line x1="${L}" x2="${W-R}" y1="${y(valuationTotal)}" y2="${y(valuationTotal)}" stroke="#2563eb" stroke-width="3"/>
   <polyline points="${projPts}" fill="none" stroke="#15803d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
   ${points.map((p,i)=>`<circle class="sent-point" cx="${x(p.ms)}" cy="${y(p.cumulative)}" r="${i===0?4:5}" fill="#15803d" stroke="#fff" stroke-width="2" tabindex="0" role="button" aria-label="${esc(p.label)}" onmouseenter="showSentTimelinePoint(${i})" onclick="showSentTimelinePoint(${i})" onfocus="showSentTimelinePoint(${i})"/>`).join('')}
  </svg>
  <div class="timeline-legend"><span class="timeline-key"><i class="timeline-swatch timeline-current"></i>Valoración actual · ${money(valuationTotal)}</span><span class="timeline-key"><i class="timeline-swatch timeline-projected"></i>Ingreso proyectado acumulado · ${money(projectedTotal)}</span></div>
  <div id="sentTimelineDetail" class="timeline-detail"><div class="timeline-detail-grid"><div><small>Fecha de valoración</small><b>${dateFmt(rawRows[0]?.valuation_date||state.cutoff)}</b></div><div><small>Valoración actual</small><b>${money(valuationTotal)}</b></div><div><small>Ingreso proyectado total</small><b>${money(projectedTotal)}</b></div><div><small>Diferencia proyectada</small><b>${money(projectedTotal-valuationTotal)}</b></div></div><div class="timeline-note">Selecciona un punto de la línea verde para ver el ingreso previsto de ese periodo y las sentencias que lo componen.${overdue?' '+overdue+' expectativa(s) anteriores a la fecha de valoración se concentran en el punto inicial.':''}</div></div>
  <div class="source">Comparación basada en Fecha Valoración / Valoración (X/Y) y Expectativa de Pago / Valoración en Pago (AA/AB) del archivo fuente.</div>
 </section>`
}
function showSentTimelinePoint(i){
 const p=sentTimelinePoints[i], box=document.getElementById('sentTimelineDetail'); if(!p||!box)return;
 const cases=(p.cases||[]).map(c=>`<div>• ${esc(c.case)} · ${esc(c.investor)} · ${money(c.value)}${c.originalDate&&utcDateMs(c.originalDate)<p.ms?' · expectativa original '+dateFmt(c.originalDate):''}</div>`).join('');
 box.innerHTML=`<div class="timeline-detail-grid"><div><small>Periodo</small><b>${p.label}</b></div><div><small>Ingreso del periodo</small><b>${money(p.income)}</b></div><div><small>Proyección acumulada</small><b>${money(p.cumulative)}</b></div><div><small>Brecha vs. valoración</small><b>${money(p.gap)}</b></div></div>${cases?`<div class="timeline-case-list">${cases}</div>`:'<div class="timeline-note">Inicio de la línea de tiempo.</div>'}`;
}
function renderSentencias(p){
 const rows=aggregateSentRows(state.sentTab);

 const inv=sum(rows,'investment'), val=sum(rows,'current_or_return'), profit=val-inv;
 const flows=[];
 rows.forEach(r=>{if(r.invest_date)flows.push({date:r.invest_date,value:-r.investment});if(r.valuation_date)flows.push({date:r.valuation_date,value:r.current_or_return})});
 flows.sort((a,b)=>a.date.localeCompare(b.date));
 const tir=xirr(flows);
 const unique=new Set(rows.map(r=>r.group_key)).size;
 const invs=[...new Set(DATA.sentencias.rows.map(r=>r.investor_norm).filter(Boolean))].sort();

 let h=projectHeader(p,'Portafolio judicial · selección múltiple de empresas inversionistas');
 h+=`<div class="tabs"><button class="tab ${state.sentTab==='Vigente'?'active':''}" onclick="state.sentTab='Vigente';render()">Vigentes</button><button class="tab ${state.sentTab==='Cancelado'?'active':''}" onclick="state.sentTab='Cancelado';render()">Canceladas</button></div>
 <div class="filters">
  <div class="multi-filter">
   <label>Empresas inversionistas · selección múltiple</label>
   <div class="multi-options">
    <label class="checkchip ${selected.length===0?'selected':''}"><input type="checkbox" ${selected.length===0?'checked':''} onchange="if(this.checked)clearSentInvestors();else this.checked=true">Todas</label>
    ${invs.map(x=>`<label class="checkchip ${selected.includes(x)?'selected':''}"><input type="checkbox" ${selected.includes(x)?'checked':''} onchange="toggleSentInvestor('${x}',this.checked)">${esc(investorLabel(x))}</label>`).join('')}
   </div>

  </div>
  <div class="filter"><label>Entidad</label><select onchange="state.sentEntity=this.value;render()"><option value="ALL">Todas</option>${ents.map(x=>`<option ${state.sentEntity===x?'selected':''}>${x}</option>`).join('')}</select></div>
  <div class="filter"><label>Régimen</label><select onchange="state.sentRegime=this.value;render()"><option value="ALL">Todos</option>${regs.map(x=>`<option ${state.sentRegime===x?'selected':''}>${x}</option>`).join('')}</select></div>
  <div class="filter"><label>Buscar caso</label><input placeholder="Nombre del caso" value="${esc(state.sentQuery)}" oninput="state.sentQuery=this.value;render()"></div>
 </div>`;
 h+=`<div class="kpis">
  ${kpi('Sentencias',unique,'Casos jurídicos únicos filtrados')}
  ${kpi('Inversión',money(inv),'Suma atribuible · '+selectedText)}
  ${kpi(state.sentTab==='Vigente'?'Valoración actual':'Valor recibido / retorno',money(val),'Suma atribuible')}
  ${kpi(state.sentTab==='Vigente'?'Utilidad potencial':'Utilidad realizada',money(profit))}
  ${kpi(state.sentTab==='Vigente'?'TIR portafolio':'TIR realizada',tir==null?'—':pct(tir),'Recalculada con flujos combinados')}
  ${kpi('Empresas seleccionadas',selected.length||invs.length,selectedText)}
 </div>`;
 if(state.sentTab==='Vigente')h+=sentTimelineChart(rawRows);
 h+=`<div class="section-title"><div><h3>${state.sentTab==='Vigente'?'Portafolio vigente':'Negocios cancelados'}</h3><p>La misma sentencia se cuenta una sola vez en el número de casos; sus participaciones financieras sí se suman según las empresas seleccionadas.</p></div></div>
 <div class="tablewrap"><table><thead><tr><th>Estado</th><th>Caso</th><th>Inversionista</th><th>% Part.</th><th>Fecha inversión</th><th style="text-align:right">Inversión</th><th style="text-align:right">${state.sentTab==='Vigente'?'Valoración actual':'Retorno real'}</th><th style="text-align:right">TIR</th></tr></thead><tbody>
 ${rows.map(r=>`<tr><td><span class="status ${r.state==='Vigente'?'ready':''}">${r.state}</span></td><td><button class="case-link" onclick="openCase('${encodeURIComponent(r.group_key)}')">${esc(r.case)}</button><div class="muted" style="font-size:10px">${esc(r.entity||'')} · ${esc(r.regime||'')}</div></td><td>${esc(investorLabel(r.investor_norm)||'—')}</td><td>${r.participation_pct==null?'—':r.participation_pct.toLocaleString('es-CO',{maximumFractionDigits:2})+'%'}</td><td>${dateFmt(r.invest_date)}</td><td class="num">${money(r.investment)}</td><td class="num">${money(r.current_or_return)}</td><td class="num">${pct(r.tirCalc||0)}</td></tr>`).join('')}
 </tbody></table></div>
 <div class="source">Fuente: ${esc(DATA.sentencias.summary.source)} · Actualizada ${DATA.sentencias.summary.updated} · Selección: ${esc(selectedText)}</div>`;
 return h
}
function openCase(encoded){const key=decodeURIComponent(encoded);const c=DATA.sentencias.cases.find(x=>x.group_key===key);if(!c)return; $('#modalTitle').textContent=c.case;$('#modalSubtitle').textContent=[c.entity,c.turno,c.regime].filter(Boolean).join(' · '); const invMap=new Map(); c.investors.forEach(i=>{const k=i.name; if(!invMap.has(k))invMap.set(k,{name:k,participation_pct:0,investment:0,current_or_return:0,tir:[]});const x=invMap.get(k);x.participation_pct=Math.max(x.participation_pct,i.participation_pct||0);x.investment+=i.investment;x.current_or_return+=i.current_or_return;x.tir.push(i.tir)}); const invs=[...invMap.values()]; $('#modalBody').innerHTML=`<div class="detail-grid"><div class="detail"><small>Estado</small><b>${c.state}</b></div><div class="detail"><small>Fecha ejecutoria</small><b>${dateFmt(c.fecha_ejecutoria)}</b></div><div class="detail"><small>Fecha cuenta cobro</small><b>${dateFmt(c.fecha_cobro)}</b></div><div class="detail"><small>Inversión consolidada</small><b>${money(c.investment)}</b></div><div class="detail"><small>${c.state==='Vigente'?'Valoración actual':'Retorno / valor registrado'}</small><b>${money(c.current_or_return)}</b></div><div class="detail"><small>Resultado</small><b>${money(c.profit)}</b></div><div class="detail"><small>Participaciones</small><b>${invs.length}</b></div><div class="detail"><small>Componentes fuente</small><b>${c.rows}</b></div></div><div class="section-title"><div><h3>Participación por empresa</h3><p>Consolidada dentro del caso</p></div></div><div class="tablewrap"><table style="min-width:650px"><thead><tr><th>Empresa</th><th>% participación</th><th style="text-align:right">Inversión</th><th style="text-align:right">Valor / retorno</th><th style="text-align:right">TIR fuente</th></tr></thead><tbody>${invs.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.participation_pct.toLocaleString('es-CO',{maximumFractionDigits:2})}%</td><td class="num">${money(i.investment)}</td><td class="num">${money(i.current_or_return)}</td><td class="num">${pct(i.tir.reduce((a,b)=>a+b,0)/Math.max(1,i.tir.length))}</td></tr>`).join('')}</tbody></table></div><div class="section-title"><div><h3>Ficha consolidada</h3><p>La versión productiva añadirá línea de tiempo, suspensiones, tasas, eventos de venta/pago y soportes.</p></div></div><div class="notice">Esta ficha ya conserva la jerarquía Sentencia → Participaciones → Componentes y será el punto de entrada al detalle jurídico-financiero definido en el Paso 100.</div>`;$('#caseModal').classList.add('show')}
function renderLiquitty(p){
 const s=DATA.liquitty.summary, proj=DATA.liquitty.projection, act=DATA.liquitty.actual;
 const cumProj=[]; let cp=0; proj.forEach(v=>{cp+=Number(v||0);cumProj.push(cp)});
 const cumAct=[]; let ca=0; act.forEach(v=>{ca+=Number(v.net||0);cumAct.push(ca)});
 const W=1040,H=330,L=68,R=24,T=25,B=42,maxY=Math.max(s.projected_net_total,s.investment)*1.05;
 const x=i=>L+(i/(s.months-1))*(W-L-R), y=v=>T+(1-v/maxY)*(H-T-B);
 const projPts=cumProj.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
 const actPts=cumAct.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
 const yTicks=[0,.25,.5,.75,1].map(q=>({v:maxY*q,y:y(maxY*q)}));
 const xTicks=[1,12,24,36,48,60,72,84,96];
 const investY=y(s.investment);
 const detailRows=act.map((a,i)=>{const pr=proj[i]||0, comp=pr?a.net/pr:0;return `<tr><td>M${a.month}</td><td class="num">${money(a.gross)}</td><td class="num">${money(a.commission)}</td><td class="num">${money(a.vat)}</td><td class="num"><b>${money(a.net)}</b></td><td class="num">${money(pr)}</td><td class="num">${pct(comp)}</td></tr>`}).join("");
 return projectHeader(p,"Recuperación de inversión · INVERSIONES EON · plan de 96 meses")+
 `<div class="liq-owner"><span class="owner-badge">Empresa inversionista · ${esc(s.owner)}</span><span class="badge">Inversión desde ${dateFmt(s.investment_date)}</span><span class="badge">${s.actual_periods} pagos registrados / ${s.months} meses proyectados</span></div>
 <div class="kpis">
 ${kpi("Inversión inicial",money(s.investment),"30/10/2025")}
 ${kpi("Retorno neto proyectado",money(s.projected_net_total),s.months+" meses")}
 ${kpi("Neto recibido",money(s.actual_net),pct(s.recovery_pct)+" de la inversión")}
 ${kpi("Capital pendiente",money(s.remaining_capital),pct(1-s.recovery_pct)+" por recuperar")}
 ${kpi("Cumplimiento vs proyección",pct(s.execution_vs_projection_to_date),(s.ahead_vs_projection_to_date>=0?"+":"")+money(s.ahead_vs_projection_to_date))}
 ${kpi("Utilidad proyectada",money(s.projected_profit),"Retorno proyectado − inversión")}
 </div>
 <div class="grid2">
  <section class="panel"><div class="panelhead"><div><h3>Ingresos ejecutados</h3><p>De bruto a neto recibido en INVERSIONES EON</p></div><span class="pill green">Ejecución real</span></div>
   <div class="waterfall">
    <div class="water-item"><small>Ingreso bruto</small><b>${money(s.actual_gross)}</b></div>

    <div class="water-item cost"><small>IVA comisión</small><b>− ${money(s.commission_vat)}</b></div>
    <div class="water-item net"><small>Neto recibido</small><b>${money(s.actual_net)}</b></div>
   </div>
  </section>
  <section class="panel"><div class="panelhead"><div><h3>Recuperación de capital</h3><p>Avance contra la inversión inicial</p></div><span class="pill">${pct(s.recovery_pct)}</span></div>
   <div style="font-size:13px;margin-bottom:8px">Recuperado <b style="float:right">${money(s.actual_net)}</b></div>
   <div class="recovery-bar"><span style="width:${Math.min(100,s.recovery_pct*100)}%"></span></div>
   <div style="font-size:12px;color:#667085;margin-top:9px">Pendiente para recuperar el 100% del capital: <b>${money(s.remaining_capital)}</b>.</div>
  </section>
 </div>
 <section class="panel" style="margin-top:14px"><div class="panelhead"><div><h3>Proyección vs. ejecución acumulada</h3><p>Retorno neto acumulado · Mes 1 a Mes 96</p></div><span class="pill">Fuente: columna Q vs. columna S</span></div>
 <svg class="liq-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Proyección y ejecución acumulada de Liquitty">
  ${yTicks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${t.y}" y2="${t.y}" stroke="#e5e7eb" stroke-width="1"/><text x="${L-10}" y="${t.y+4}" text-anchor="end" font-size="10" fill="#667085">${compact(t.v)}</text>`).join("")}
  ${xTicks.map(m=>`<line x1="${x(m-1)}" x2="${x(m-1)}" y1="${T}" y2="${H-B}" stroke="#f1f3f5" stroke-width="1"/><text x="${x(m-1)}" y="${H-17}" text-anchor="middle" font-size="10" fill="#667085">M${m}</text>`).join("")}
  <line x1="${L}" x2="${W-R}" y1="${investY}" y2="${investY}" stroke="#b45309" stroke-width="2" stroke-dasharray="7 6"/>
  <polyline points="${projPts}" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="${actPts}" fill="none" stroke="#15803d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="${x(act.length-1)}" cy="${y(cumAct[cumAct.length-1])}" r="5" fill="#15803d"/>
 </svg>
 <div class="chart-legend"><span><i class="legend-line legend-proj"></i>Proyección neta acumulada</span><span><i class="legend-line legend-real"></i>Ejecución neta acumulada</span><span><i class="legend-line legend-invest"></i>Inversión inicial ${money(s.investment)}</span></div>
 </section>
 <div class="section-title"><div><h3>Detalle mensual ejecutado</h3><p>R = ingreso bruto · X = comisión · Y = IVA comisión · S = neto recibido</p></div></div>
 <div class="tablewrap"><table><thead><tr><th>Mes</th><th style="text-align:right">Ingreso bruto</th><th style="text-align:right">Comisión</th><th style="text-align:right">IVA comisión</th><th style="text-align:right">Neto recibido</th><th style="text-align:right">Proyección neta</th><th style="text-align:right">Cumplimiento</th></tr></thead><tbody>${detailRows}</tbody></table></div>
 <div class="source">Fuente: ${esc(s.source)} · SharePoint · Actualizada ${dateFmt(s.updated)}. La proyección usa Q25:Q120; la ejecución usa los registros desde R25/S25/X25/Y25.</div>`;
}
function renderPending(p){return projectHeader(p,'Proyecto configurado en SOCIOS')+globalFilters()+`<div class="empty panel"><h3 style="margin-top:0">Estructura lista</h3><p>Este proyecto ya hace parte del menú y de los filtros globales. La fuente financiera todavía no ha sido incorporada al MVP.</p><span class="status">Pendiente de fuente / configuración</span><div class="source">No se muestran ceros para evitar interpretar ausencia de datos como saldo financiero.</div></div>`}
function renderProject(){const p=projectById(state.project);$('#pageTitle').textContent=p.name;$('#pageSub').textContent=p.companies.join(' · ');let h;if(p.id==='as')h=renderAS(p);else if(p.id==='boracay')h=renderBoracay(p);else if(p.id==='colegios')h=renderColegios(p);else if(p.id==='sentencias')h=renderSentencias(p);else if(p.id==='liquitty')h=renderLiquitty(p);else h=renderPending(p);$('#content').innerHTML=h}

function renderAlerts(){state.project=null;$('#pageTitle').textContent='Alertas';$('#pageSub').textContent='Control de calidad y actualización';const pending=DATA.projects.filter(p=>p.status!=='Con datos');$('#content').innerHTML=`<div class="kpis">${kpi('Pendientes de fuente',pending.length)}${kpi('Fuentes activas',DATA.projects.length-pending.length)}${kpi('Sentencias fuente',DATA.sentencias.summary.rows+' filas','22 vigentes · 13 canceladas')}</div><div class="section-title"><div><h3>Pendientes del MVP</h3><p>Proyectos listos para recibir información</p></div></div><div class="project-grid">${pending.map(projectCard).join('')}</div>`}
function render(){setNav();if(state.project)renderProject();else if(state.view==='investments')renderInvestments();else if(state.view==='alerts')renderAlerts();else renderGeneral()}
$('#closeModal').onclick=()=>$('#caseModal').classList.remove('show');$('#caseModal').onclick=e=>{if(e.target.id==='caseModal')$('#caseModal').classList.remove('show')};initNav();render();if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
